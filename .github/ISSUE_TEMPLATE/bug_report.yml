name: Reporte de defecto
description: Reportar un problema reproducible
title: "bug: "
body:
  - type: textarea
    id: summary
    attributes:
      label: Resumen
      description: Describe el resultado observado sin incluir datos sensibles.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Pasos para reproducir
      value: "1.\n2.\n3."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Entorno y versión
    validations:
      required: true
