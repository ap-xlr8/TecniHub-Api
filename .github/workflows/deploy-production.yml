name: Deploy backend production

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  deployments: write

concurrency:
  group: backend-deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Restore, format, build and test
        run: |
          dotnet restore TECNIHUB.sln
          dotnet format TECNIHUB.sln --verify-no-changes --no-restore
          dotnet build TECNIHUB.sln --configuration Release --no-restore
          dotnet test TECNIHUB.sln --configuration Release --no-build
      - name: Publish API
        run: dotnet publish src/TECNIHUB.API/TECNIHUB.API.csproj --configuration Release --no-build --output ./publish
      - name: Validate Azure settings
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          AZURE_HEALTH_CHECK_URL: ${{ vars.AZURE_HEALTH_CHECK_URL }}
        run: |
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_WEBAPP_NAME AZURE_HEALTH_CHECK_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required production variable: $name"
              exit 1
            fi
          done
      - name: Log in to Azure with OIDC
        uses: azure/login@053f7285eb20bf5469ef084617b0b24d3cec53fc # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy to production App Service
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ./publish
      - name: Check production health
        env:
          HEALTH_CHECK_URL: ${{ vars.AZURE_HEALTH_CHECK_URL }}
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 --max-time 20 "$HEALTH_CHECK_URL"
